<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Propiedad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4"><i class="bi bi-plus-circle"></i> Agregar Propiedad</h1>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">Información Básica</h5>
                <div class="mb-3">
                    <label class="form-label">Título *</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripción *</label>
                    <textarea name="description" class="form-control" rows="3" required></textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tipo *</label>
                        <select name="property_type" class="form-select" required>
                            {% for value, label in property_types_catalog %}
                            <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Operación *</label>
                        <select name="operation_type" class="form-select" required>
                            <option value="venta">Venta</option>
                            <option value="renta">Renta</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Precio *</label>
                    <input type="number" name="price" class="form-control" step="0.01" required>
                </div>
            </div>
        </div>
        
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">Ubicación</h5>
                <div class="alert alert-info">
                    <i class="bi bi-info-circle"></i> Ve a <a href="https://www.google.com/maps" target="_blank">Google Maps</a>, haz clic derecho en la ubicación y copia las coordenadas.
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Latitud *</label>
                        <input type="text" name="latitude" class="form-control" placeholder="19.432608" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Longitud *</label>
                        <input type="text" name="longitude" class="form-control" placeholder="-99.133209" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Dirección *</label>
                    <input type="text" name="address" class="form-control" required>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Ciudad *</label>
                        <input type="text" name="city" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Estado *</label>
                        <input type="text" name="state" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Código Postal</label>
                        <input type="text" name="zip_code" class="form-control">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">Características</h5>
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Terreno (m²) *</label>
                        <input type="number" name="lot_area" class="form-control" step="0.01" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Construcción (m²) *</label>
                        <input type="number" name="construction_area" class="form-control" step="0.01" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Recámaras</label>
                        <input type="number" name="bedrooms" class="form-control" value="0">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Baños</label>
                        <input type="number" name="bathrooms" class="form-control" value="0">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">Imágenes</h5>
                <input type="file" name="images" class="form-control" multiple accept="image/*">
            </div>
        </div>
        
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="bi bi-check-circle"></i> Guardar Propiedad
            </button>
            <a href="/" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
