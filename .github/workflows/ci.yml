name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    # SQLite en CI: migrate/tests estables en cada push.
    # PostgreSQL se valida en staging/prod con `migrate` contra RDS (ver ESTADO_Y_PLAN.md).
    env:
      DJANGO_SETTINGS_MODULE: total_living.settings.development
      DATABASE_URL: sqlite:///ci_test.sqlite3
      SECRET_KEY: ci-test-secret-key-not-for-production-use-only-32chars
      ALLOWED_HOSTS: localhost,127.0.0.1
      ENFORCE_STRONG_SECRET_KEY: "False"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations
        run: python manage.py migrate --noinput --verbosity=2

      - name: Tests
        run: python manage.py test properties panel search contact accounts developments --verbosity=1
