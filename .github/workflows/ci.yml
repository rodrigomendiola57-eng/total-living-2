name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: total_living
          POSTGRES_PASSWORD: total_living
          POSTGRES_DB: total_living_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U total_living -d total_living_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: total_living.settings.development
      DATABASE_URL: postgresql://total_living:total_living@localhost:5432/total_living_test
      SECRET_KEY: ci-test-secret-key-not-for-production-use-only-32chars
      ALLOWED_HOSTS: localhost,127.0.0.1
      ENFORCE_STRONG_SECRET_KEY: "False"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations
        run: python manage.py migrate --noinput --verbosity=2 || (python manage.py showmigrations && exit 1)

      - name: Tests
        run: python manage.py test properties panel search contact accounts developments --verbosity=1
