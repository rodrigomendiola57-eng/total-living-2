# Blueprint Render — Total Living
# Repo: rodrigomendiola57-eng/total-living-2

services:
  - type: web
    name: total-living
    runtime: python
    region: ohio
    plan: starter
    buildCommand: pip install -r requirements.txt && DJANGO_SETTINGS_MODULE=total_living.settings.production ENVIRONMENT=production python manage.py collectstatic --no-input
    startCommand: gunicorn total_living.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 90
    preDeployCommand: python manage.py migrate --noinput
    healthCheckPath: /health/live/
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: total_living.settings.production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ENFORCE_STRONG_SECRET_KEY
        value: "True"
      - key: ALLOWED_HOSTS
        value: totalliving.mx,www.totalliving.mx,total-living.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://totalliving.mx,https://www.totalliving.mx,https://total-living.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://www.totalliving.mx
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SERVE_LOCAL_MEDIA
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: USE_OBJECT_STORAGE
        value: "True"
      - key: OBJECT_STORAGE_PROVIDER
        value: aws
      - key: USE_S3_MEDIA
        value: "True"
      - key: USE_S3_STATIC
        value: "False"
      - key: AWS_STORAGE_BUCKET_NAME
        value: totalliving-media-s3-prod-rm-us-east-1-001
      - key: AWS_S3_REGION_NAME
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_QUERYSTRING_AUTH
        value: "True"
      - key: AWS_QUERYSTRING_EXPIRE
        value: "900"
      - key: ADMIN_URL_PATH
        value: gestion-total-living-2026/
      - key: PANEL_URL_PATH
        value: acceso-interno-staff-2026/
      - key: MAP_TILE_URL
        value: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png"
      - key: MAP_TILE_ATTRIBUTION
        value: "OpenStreetMap contributors, CARTO"
      - key: MAP_TILE_SUBDOMAINS
        value: abcd
      - key: MAP_TILE_MAX_ZOOM
        value: "20"
