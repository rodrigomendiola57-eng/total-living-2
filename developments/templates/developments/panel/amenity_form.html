{% extends 'developments/panel/shell.html' %}

{% block title %}{{ title }}{% endblock %}

{% block dev_panel_body %}
<div class="edit-container">
    <div class="page-header">
        <h1 class="page-title">{{ title }}</h1>
        <a href="{% url 'developments:panel_amenities' %}" class="btn-secondary">← Volver</a>
    </div>
    <form method="post" class="form-section">
        {% csrf_token %}
        <div class="form-grid">
            <div class="form-group full">
                <label for="code">Clave (slug)</label>
                <input type="text" id="code" name="code" class="form-control" maxlength="50"
                       value="{{ amenity.slug|default:'' }}" placeholder="alberca, gym, cowork…">
            </div>
            <div class="form-group full">
                <label for="category_id">Categoría *</label>
                <select id="category_id" name="category_id" class="form-control" required>
                    {% for c in categories %}
                    <option value="{{ c.pk }}" {% if amenity and amenity.category_id == c.pk %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group full">
                <label for="name">Nombre visible *</label>
                <input type="text" id="name" name="name" class="form-control" required maxlength="120" value="{{ amenity.name|default:'' }}">
            </div>
            <div class="form-group full">
                <label for="display_name">Etiqueta mostrada</label>
                <input type="text" id="display_name" name="display_name" class="form-control" maxlength="120" value="{{ amenity.display_name|default:'' }}" placeholder="Gimnasio, Alberca, Coworking...">
            </div>
            <div class="form-group">
                <label for="icon">Icono Bootstrap</label>
                <input type="text" id="icon" name="icon" class="form-control" maxlength="40" value="{{ amenity.icon|default:'bi-check2-circle' }}" placeholder="bi-water, bi-shield-check...">
                <small class="text-muted">Usa iconos minimalistas Bootstrap. Se pintan en verde olivo.</small>
            </div>
            <div class="form-group">
                <label for="priority_score">Prioridad</label>
                <input type="number" id="priority_score" name="priority_score" class="form-control" value="{{ amenity.priority_score|default:0 }}">
            </div>
            <div class="form-group full">
                <label for="description">Descripción</label>
                <textarea id="description" name="description" class="form-control" rows="3">{{ amenity.description|default:'' }}</textarea>
            </div>
            <div class="form-group full">
                <label><input type="checkbox" name="is_premium" value="1" {% if amenity and amenity.is_premium %}checked{% endif %}> Premium</label>
            </div>
            <div class="form-group full">
                <label><input type="checkbox" name="is_active" value="1" {% if not amenity or amenity.is_active %}checked{% endif %}> Activa</label>
            </div>
        </div>
        <button type="submit" class="btn-primary mt-3">Guardar</button>
    </form>
</div>
{% endblock %}
